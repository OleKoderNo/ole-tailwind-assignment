<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Feed</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>

	<body class="bg-slate-100">
		<header class="bg-slate-900 text-white">
			<nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between p-4">
				<a href="/" class="text-xl font-bold">Cool project name</a>

				<input id="menu-toggle" type="checkbox" class="peer hidden" />

				<label
					for="menu-toggle"
					class="cursor-pointer rounded border border-white px-4 py-2 md:hidden"
					aria-label="Toggle menu"
				>
					☰
				</label>

				<!-- Mobile dropdown -->
				<div class="hidden w-full flex-col gap-2 pt-4 text-center peer-checked:flex md:hidden">
					<a href="/feed/" class="rounded bg-slate-700 px-4 py-2">Home</a>
					<a href="/profile/" class="rounded bg-slate-700 px-4 py-2">Profile</a>
					<a href="/index.html" class="rounded bg-blue-500 px-4 py-2">Log out</a>
				</div>

				<!-- Desktop menu -->
				<div class="hidden flex-1 justify-center gap-6 md:flex">
					<a href="/feed/" class="hover:underline">Home</a>
					<a href="/profile/" class="hover:underline">Profile</a>
				</div>

				<a
					href="/index.html"
					class="hidden rounded bg-blue-500 px-4 py-2 hover:bg-blue-700 md:block"
				>
					Log out
				</a>
			</nav>
		</header>

		<main id="feed" class="mx-auto max-w-6xl p-4">
			<section class="mb-6">
				<h1 class="mb-4 text-3xl font-bold text-slate-900">Feed</h1>

				<div class="flex flex-col gap-3 md:flex-row md:items-center">
					<input
						type="search"
						name="search"
						placeholder="Search posts..."
						class="w-full rounded border border-slate-300 bg-white px-4 py-2 md:w-80"
					/>

					<select
						name="sort"
						class="w-full rounded border border-slate-300 bg-white px-4 py-2 md:w-40"
					>
						<option value="newest">Newest</option>
						<option value="oldest">Oldest</option>
						<option value="popular">Most popular</option>
					</select>

					<a
						href="#create-post"
						class="w-full rounded bg-green-600 px-4 py-2 text-center font-medium text-white hover:bg-green-700 md:w-auto"
					>
						Create new post
					</a>
				</div>
			</section>

			<section class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
				<article class="overflow-hidden rounded-lg bg-white shadow">
					<img
						src="../images/iced-milo.jpg"
						alt="Post thumbnail"
						class="h-48 w-full object-cover"
					/>
					<div class="p-4">
						<h2 class="mb-2 text-xl font-bold">Ice Milo</h2>
						<p class="mb-3 text-slate-600">Ice Milo is an amazing drink.</p>
						<a href="#" class="font-medium text-blue-600 hover:underline">Read more</a>
					</div>
				</article>

				<article class="overflow-hidden rounded-lg bg-white shadow">
					<img
						src="../images/birthday-cake.jpg"
						alt="Post thumbnail"
						class="h-48 w-full object-cover"
					/>
					<div class="p-4">
						<h2 class="mb-2 text-xl font-bold">My birthday</h2>
						<p class="mb-3 text-slate-600">I was celebrating my birthday in Singapore.</p>
						<a href="#" class="font-medium text-blue-600 hover:underline">Read more</a>
					</div>
				</article>

				<article class="overflow-hidden rounded-lg bg-white shadow">
					<img
						src="../images/woking-in-asia.jpg"
						alt="Post thumbnail"
						class="h-48 w-full object-cover"
					/>
					<div class="p-4">
						<h2 class="mb-2 text-xl font-bold">New job?</h2>
						<p class="mb-3 text-slate-600">I was helping Sabrina out at her shop!</p>
						<a href="#" class="font-medium text-blue-600 hover:underline">Read more</a>
					</div>
				</article>
			</section>
		</main>

		<dialog
			id="create-post"
			aria-label="Create new post dialog"
			class="w-[min(32rem,calc(100%-1.5rem))] max-w-lg bg-transparent p-0 text-slate-900"
		>
			<a
				href="#feed"
				aria-label="Close dialog"
				class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm"
			></a>

			<div class="relative z-[60] mt-[8vh] rounded-xl bg-white p-6 shadow-xl">
				<div class="mb-4 flex items-start justify-between gap-4">
					<h2 class="text-2xl font-bold">Create new post</h2>

					<a
						href="#feed"
						aria-label="Close dialog"
						class="rounded bg-slate-200 px-3 py-1 text-slate-900 hover:bg-slate-300"
					>
						✕
					</a>
				</div>

				<form action="/feed/" method="get" class="flex flex-col gap-4">
					<div>
						<label for="title" class="mb-1 block font-medium">Title</label>
						<input
							id="title"
							name="title"
							type="text"
							required
							minlength="3"
							class="w-full rounded border border-slate-300 px-3 py-2"
						/>
					</div>

					<div>
						<label for="image" class="mb-1 block font-medium">Image URL</label>
						<input
							id="image"
							name="image"
							type="url"
							required
							class="w-full rounded border border-slate-300 px-3 py-2"
						/>
					</div>

					<div>
						<label for="content" class="mb-1 block font-medium">Content</label>
						<textarea
							id="content"
							name="content"
							rows="4"
							required
							minlength="10"
							class="w-full rounded border border-slate-300 px-3 py-2"
						></textarea>
					</div>

					<button
						type="submit"
						class="rounded bg-green-600 px-4 py-2 font-medium text-white hover:bg-green-700"
					>
						Publish post
					</button>
				</form>
			</div>
		</dialog>
	</body>
</html>
